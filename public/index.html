<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="한국도키멕 P**V 제품 상세페이지의 두 가지 시안을 비교해 보세요."
    />
    <title>P**V 상세페이지 시안 | 한국도키멕</title>
    <style>
      :root {
        color: #15253a;
        background: #ffffff;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      section {
        width: min(720px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.07em;
      }

      p {
        margin: 0 0 32px;
        color: #61727c;
        font-size: 15px;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      a {
        min-height: 160px;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px 16px;
        border: 1px solid #d8e2e7;
        background: #ffffff;
        color: inherit;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        letter-spacing: -0.07em;
        text-decoration: none;
        transition: transform 0.2s, background 0.2s, border-color 0.2s,
          color 0.2s, box-shadow 0.2s;
      }

      a span { font-size: 14px; font-weight: 500; letter-spacing: .02em; }

      a strong { font-size: clamp(24px, 4vw, 34px); font-weight: 700; }

      @media (prefers-reduced-motion: reduce) { a { transition: none; } }

      a:hover,
      a:focus-visible {
        transform: translateY(-4px);
        border-color: #075a9a;
        background: #075a9a;
        color: #ffffff;
        box-shadow: 0 16px 32px rgba(7, 90, 154, 0.2);
        outline: none;
      }

      @media (max-width: 560px) {
        main {
          padding: 20px;
        }

        nav {
          grid-template-columns: 1fr;
        }

        a {
          min-height: 100px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <h1 id="page-title">P**V 제품 상세 시안</h1>
        <p>확인할 상세페이지 시안을 선택하세요.</p>
        <nav aria-label="홈페이지 시안 선택">
          <a href="./pv-basic.html"><span>시안 01</span><strong>기본형</strong></a>
          <a href="./pv-v1.html"><span>시안 02</span><strong>V1 디자인형</strong></a>
        </nav>
      </section>
    </main>
  </body>
</html>
