<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="한국도키멕 제품별 상세페이지에서 제품 설명, 사양과 카탈로그를 확인하세요."
    />
    <title>제품별 상세페이지 리스트 | 한국도키멕</title>
    <style>
      :root {
        color: #15253a;
        background: #ffffff;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      section {
        width: min(1280px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.07em;
        word-break: keep-all;
      }

      p {
        margin: 0 0 32px;
        color: #61727c;
        font-size: 15px;
      }

      .product-list {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        min-height: 160px;
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px 16px;
        border: 1px solid #d8e2e7;
        background: #ffffff;
        color: inherit;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition:
          transform 0.2s,
          background 0.2s,
          border-color 0.2s,
          color 0.2s,
          box-shadow 0.2s;
      }

      a span {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      a strong {
        font-size: clamp(24px, 4vw, 34px);
        font-weight: 700;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-4px);
        border-color: #075a9a;
        background: #075a9a;
        color: #ffffff;
        box-shadow: 0 16px 32px rgba(7, 90, 154, 0.2);
        outline: none;
      }

      @media (max-width: 1100px) {
        .product-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        main {
          padding: 20px;
        }

        .product-list {
          grid-template-columns: 1fr;
        }

        a {
          min-height: 100px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <h1 id="page-title">제품별 상세페이지 리스트</h1>
        <p>상세페이지를 확인할 제품을 선택하세요</p>
        <nav aria-label="제품별 상세페이지 목록">
          <ul class="product-list">
            <li>
              <a href="./pv-v1.html"
                ><span>제품 01</span><strong>P**V Series</strong></a
              >
            </li>
            <li>
              <a href="./ph.html"><span>제품 02</span><strong>PH Series</strong></a>
            </li>
            <li>
              <a href="./sqp-sqps-single.html"><span>제품 03 · 1연 베인펌프</span><strong>SQP/SQPS Series</strong></a>
            </li>
            <li>
              <a href="./sqp-sqps-double.html"><span>제품 04 · 2연 베인펌프</span><strong>SQP/SQPS Series</strong></a>
            </li>
          </ul>
        </nav>
      </section>
    </main>
  </body>
</html>
