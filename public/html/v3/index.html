<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>한국도키멕 HTML V3</title>
    <link rel="stylesheet" href="../../static/css/v3/styles.css" />
  </head>

  <body>
    <header data-header data-active="home" data-overlay="true"></header>
    <main>
      <section
        class="hero"
        data-hero
        aria-label="한국도키멕 메인 이미지"
      ></section>
      <section class="story">
        <section class="message">
          <button data-lightbox-trigger aria-label="이미지 확대">
            <img src="../../v3-message.jpg" alt="함께라서 멀리갈 수 있습니다" />
          </button>
        </section>
        <section class="gallery">
          <img src="../../v3-feature-left.jpg" alt="한국도키멕 제품 생산라인" />
          <div class="gallery-grid">
            <img src="../../v3-feature-01.jpg" alt="공압 밸브" /><img
              src="../../v3-feature-02.jpg"
              alt="유압 밸브"
            /><img src="../../v3-feature-03.jpg" alt="유압 펌프" /><img
              src="../../v3-feature-04.jpg"
              alt="Hydraulic Unit"
            /><img
              src="../../v3-feature-05.jpg"
              alt="유압 펌프 생산과 수출"
            /><img src="../../v3-feature-06.jpg" alt="Index Pack" />
          </div>
          <img src="../../v3-feature-right.jpg" alt="공압 실린더" />
        </section>
      </section>
      <section class="partners">
        <h2>Our Partners</h2>
        <div class="partner-grid">
          <img src="../../v3-partner-tokyo.png" alt="Tokyo Keiki" /><img
            src="../../v3-partner-walvoil.jpg"
            alt="Walvoil"
          /><img src="../../v3-partner-ckd.png" alt="CKD" /><img
            src="../../v3-partner-italgroup.png"
            alt="Italgroup"
          /><img src="../../v3-partner-inovance.png" alt="Inovance" /><img
            src="../../v3-partner-atios.png"
            alt="Atios"
          /><img src="../../v3-partner-phyusis.png" alt="Phyusis" /><img
            src="../../v3-partner-matrix.jpg"
            alt="Matrix"
          /><img src="../../v3-partner-settima.png" alt="Settima" /><img
            src="../../v3-partner-casappa.png"
            alt="Casappa"
          />
        </div>
      </section>
    </main>
    <div class="lightbox" data-lightbox>
      <button aria-label="닫기">×</button
      ><img src="../../v3-message.jpg" alt="함께라서 멀리갈 수 있습니다" />
    </div>
    <footer data-footer></footer>
    <script src="../../static/js/v3/script.js"></script>
  </body>
</html>
<!-- HTML v3 -->
